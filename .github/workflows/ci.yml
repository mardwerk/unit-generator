name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unit Generator
        uses: actions/checkout@v4
        with:
          path: unit-generator

      - name: Check out Foundation beside Unit Generator
        uses: actions/checkout@v4
        with:
          repository: mardwerk/foundation
          path: foundation
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: unit-generator/.node-version
          cache: pnpm
          cache-dependency-path: |
            unit-generator/pnpm-lock.yaml
            foundation/pnpm-lock.yaml

      - name: Install Foundation
        working-directory: foundation
        run: pnpm install --frozen-lockfile

      - name: Build Foundation
        working-directory: foundation
        run: pnpm build

      - name: Install Unit Generator
        working-directory: unit-generator
        run: pnpm install --frozen-lockfile

      - name: Check Unit Generator
        working-directory: unit-generator
        run: pnpm check

      - name: Install Chromium
        working-directory: unit-generator
        run: pnpm --filter @mardwerk/unit-web exec playwright install --with-deps chromium

      - name: Run stateless playground flows
        working-directory: unit-generator
        run: pnpm test:e2e

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Unit Generator
        uses: actions/checkout@v4
        with:
          path: unit-generator

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: unit-generator/.node-version
          cache: pnpm
          cache-dependency-path: unit-generator/pnpm-lock.yaml

      - name: Set up pinned Foundation and Unit Generator
        working-directory: unit-generator
        run: node scripts/setup.mjs

      - name: Check Unit Generator
        working-directory: unit-generator
        run: pnpm check

      - name: Verify shared mechanics through both game adapters
        working-directory: unit-generator
        run: node scripts/verify-release-mechanics.mjs

      - name: Install Chromium
        working-directory: unit-generator
        run: pnpm --filter @mardwerk/unit-web exec playwright install --with-deps chromium

      - name: Run stateless playground flows
        working-directory: unit-generator
        run: pnpm test:e2e
